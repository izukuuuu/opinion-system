    <style>
      .page { fill: #fff; }
      .layer { stroke-width: 2; filter: url(#softShadow); }
      .blueLayer { fill: url(#blueFill); stroke: #3b7fd3; }
      .greenLayer { fill: url(#greenFill); stroke: #4e9461; }
      .orangeLayer { fill: url(#orangeFill); stroke: #ff7c2e; }
      .purpleLayer { fill: url(#purpleFill); stroke: #8375c1; }
      .cyanLayer { fill: url(#cyanFill); stroke: #2696a8; }
      .redLayer { fill: url(#redFill); stroke: #ff434b; }
      .slateLayer { fill: url(#slateFill); stroke: #66758e; }
      .pill { fill: rgba(255,255,255,.76); stroke-width: 1.4; }
      .pillBlue { stroke: #3b7fd3; }
      .pillGreen { stroke: #4e9461; }
      .pillOrange { stroke: #ff7c2e; }
      .pillPurple { stroke: #8375c1; }
      .pillCyan { stroke: #2696a8; }
      .pillRed { stroke: #ff434b; }
      .pillSlate { stroke: #66758e; }
      .flow { fill: none; stroke: #243955; stroke-width: 3.4; marker-end: url(#arrowDown); }
      .support { fill: none; stroke: #243955; stroke-width: 2.3; stroke-dasharray: 8 7; marker-end: url(#arrowUpDash); }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #151515; }
      .layerTitle { font-size: 29px; font-weight: 800; }
      .itemText { font-size: 24px; font-weight: 600; }
      .hero { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .blueIcon { color: #0f5fa8; }
      .greenIcon { color: #177342; }
      .orangeIcon { color: #d95f00; }
      .purpleIcon { color: #6452a4; }
      .cyanIcon { color: #087184; }
      .redIcon { color: #d93036; }
      .slateIcon { color: #243955; }
    </style>
  </defs>

  <rect class="page" width="1456" height="1086"/>

  <!-- 主流程箭头在层框下方绘制 -->
