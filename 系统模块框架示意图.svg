      <stop offset="0" stop-color="#f4f9ff"/>
      <stop offset="1" stop-color="#edf6ff"/>
    </linearGradient>
    <linearGradient id="greenFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfffb"/>
      <stop offset="1" stop-color="#f1fff3"/>
    </linearGradient>
    <linearGradient id="orangeFill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="1" stop-color="#fff4ea"/>
