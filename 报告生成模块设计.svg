    <style>
      .page { fill: #fff; }
      .card { stroke-width: 1.5; filter: url(#softShadow); }
      .green { fill: url(#greenFill); stroke: #6d9259; }
      .gold { fill: url(#goldFill); stroke: #b49a4f; }
      .purple { fill: url(#purpleFill); stroke: #7f718b; }
      .blue { fill: url(#blueFill); stroke: #5a7c98; }
      .orange { fill: url(#orangeFill); stroke: #b28a69; }
      .agent { fill: url(#blueFill); stroke: #314557; stroke-width: 2; filter: url(#softShadow); }
      .inner { fill: rgba(255,255,255,.74); stroke: #5c6b78; stroke-width: 1.5; }
      .support { fill: #fff; stroke: #5571a0; stroke-width: 1.5; stroke-dasharray: 8 6; }
      .mainLine { fill: none; stroke: #111; stroke-width: 2.3; marker-end: url(#arrowBlack); }
      .dashLine { fill: none; stroke: #456ca8; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowDash); }
      .legendLine { fill: none; stroke: #111; stroke-width: 2.5; marker-end: url(#arrowBlack); }
      .legendDash { fill: none; stroke: #456ca8; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrowDash); }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #111; }
      .stepTitle { font-size: 18px; font-weight: 700; }
      .agentTitle { font-size: 19px; font-weight: 700; }
      .agentItem { font-size: 18px; font-weight: 700; }
      .note { font-size: 15px; font-weight: 600; }
      .legendText { font-size: 16px; font-weight: 600; }
      .hero { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .heroBlack { color: #111; }
    </style>
