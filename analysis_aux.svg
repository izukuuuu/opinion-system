  <rect class="page" width="770" height="668"/>
  <line class="divider" x1="0" y1="94" x2="770" y2="94"/>
  <line class="divider" x1="0" y1="326" x2="770" y2="326"/>
  <line class="divider" x1="0" y1="578" x2="770" y2="578"/>

  <!-- 顶部数据源 -->
  <rect class="topBox" x="170" y="18.5" width="430" height="51" rx="4" filter="url(#boxShadow)"/>
  <use href="#hi-circle-stack" class="hero heroBlue" x="284" y="27" width="36" height="36"/>
  <text class="title" x="345" y="49">专题数据与处理结果</text>

  <!-- 顶部到四层的主总线 -->
  <path class="wire" d="M385 70V107"/>
  <path class="wire" d="M103 107H671"/>
  <path class="wireArrow" d="M103 107V133"/>
  <path class="wireArrow" d="M294 107V133"/>
  <path class="wireArrow" d="M480 107V133"/>
  <path class="wireArrow" d="M671 107V133"/>

  <!-- 四层汇聚线先绘制，后续卡片背景会盖住正文区域里的线 -->
  <path class="wire" d="M103 186V316"/>
  <path class="wire" d="M294 186V316"/>
  <path class="wire" d="M480 186V316"/>
  <path class="wire" d="M671 186V316"/>
  <path class="wire" d="M103 316H671"/>
  <path class="wireArrow" d="M385 316V349"/>

  <!-- 四个分析输入层 -->
  <g id="upper-layer">
    <rect class="greenBox" x="26" y="139" width="154" height="47" rx="5"/>
    <rect class="greenBox" x="20" y="206" width="166" height="87" rx="6"/>
    <use href="#hi-chart-bar" class="hero heroGreen" x="46" y="149" width="30" height="30"/>
    <text class="label" x="88" y="168">基础指标层</text>
    <text class="body" text-anchor="middle">
      <tspan x="106" y="235">声量、趋势、情绪、</tspan>
      <tspan x="106" y="254">地域、发布者、关键词、</tspan>
      <tspan x="106" y="273">分类</tspan>
    </text>

    <rect class="purpleBox" x="215" y="139" width="154" height="47" rx="5"/>
    <rect class="purpleBox" x="209" y="206" width="166" height="87" rx="6"/>
    <use href="#hi-share" class="hero heroPurple" x="234" y="148" width="31" height="31"/>
    <text class="label" x="276" y="168">主题语义层</text>
    <text class="body" text-anchor="middle">
      <tspan x="292" y="243">主题聚类、主题关键词、</tspan>
      <tspan x="292" y="262">主题时间趋势</tspan>
    </text>

    <rect class="goldBox" x="404" y="139" width="154" height="47" rx="5"/>
    <rect class="goldBox" x="398" y="206" width="166" height="87" rx="6"/>
    <use href="#hi-user" class="hero heroGold" x="422" y="148" width="31" height="31"/>
    <text class="label" x="466" y="168">主体标注层</text>
    <text class="body" text-anchor="middle">
      <tspan x="481" y="243">媒体类型标注、</tspan>
      <tspan x="481" y="262">媒体发布内容样本</tspan>
    </text>

    <rect class="cyanBox" x="594" y="139" width="154" height="47" rx="5"/>
    <rect class="cyanBox" x="588" y="206" width="166" height="87" rx="6"/>
    <use href="#hi-magnifying-glass" class="hero heroCyan" x="612" y="148" width="32" height="32"/>
    <text class="label" x="656" y="168">证据检索层</text>
    <text class="body" text-anchor="middle">
      <tspan x="671" y="231">原始记录检索、</tspan>
      <tspan x="671" y="250">TagRAG、GraphRAG、</tspan>
      <tspan x="671" y="269">RouterRAG</tspan>
    </text>
  </g>

  <!-- 综合调用层 -->
  <rect class="bandBox" x="13" y="352" width="741" height="45" rx="4"/>
  <use href="#hi-rectangle-group" class="hero heroBlue" x="309" y="361" width="31" height="31"/>
  <text class="title" x="368" y="381">综合调用层</text>

  <!-- 综合调用层向六个能力模块分发 -->
  <path class="wire" d="M385 397V414"/>
  <path class="wire" d="M60 414H710"/>
  <path class="wireArrow" d="M60 414V433"/>
  <path class="wireArrow" d="M192 414V433"/>
  <path class="wireArrow" d="M321 414V433"/>
  <path class="wireArrow" d="M451 414V433"/>
  <path class="wireArrow" d="M579 414V433"/>
  <path class="wireArrow" d="M710 414V433"/>

  <!-- 六个能力模块 -->
  <g id="capabilities">
    <rect class="smallBox" x="6" y="438" width="108" height="61" rx="5"/>
    <use href="#hi-clock" class="hero heroBlue" x="20" y="453" width="29" height="29"/>
    <text class="smallText" x="62" y="472">时间线</text>

    <rect class="smallBox" x="137" y="438" width="110" height="61" rx="5"/>
    <use href="#hi-scale" class="hero heroBlue" x="148" y="452" width="30" height="30"/>
    <text class="smallText" x="188" y="472">主体立场</text>

    <rect class="smallBox" x="267" y="438" width="108" height="61" rx="5"/>
    <use href="#hi-cube-transparent" class="hero heroBlue" x="282" y="453" width="29" height="29"/>
    <text class="smallText" x="318" y="472">立场冲突</text>

    <rect class="smallBox" x="397" y="438" width="108" height="61" rx="5"/>
    <use href="#hi-document-text" class="hero heroBlue" x="407" y="453" width="29" height="29"/>
    <text class="smallText" x="447" y="472">议题框架</text>

    <rect class="smallBox" x="525" y="438" width="108" height="61" rx="5"/>
    <use href="#hi-signal" class="hero heroBlue" x="535" y="453" width="29" height="29"/>
    <text class="smallText" x="575" y="472">传播机制</text>

    <rect class="smallBox" x="655" y="438" width="108" height="61" rx="5"/>
    <use href="#hi-exclamation-triangle" class="hero heroBlue" x="666" y="453" width="30" height="30"/>
    <text class="smallText" x="707" y="472">风险信号</text>
  </g>

  <!-- 六个能力模块汇聚到报告生成模块 -->
  <path class="wire" d="M60 499V518"/>
  <path class="wire" d="M192 499V518"/>
  <path class="wire" d="M321 499V518"/>
  <path class="wire" d="M451 499V518"/>
  <path class="wire" d="M579 499V518"/>
  <path class="wire" d="M710 499V518"/>
  <path class="wire" d="M60 518H710"/>
  <path class="wireArrow" d="M385 518V590"/>

  <!-- 报告生成模块 -->
  <rect class="bandBox" x="15" y="595" width="739" height="58" rx="4"/>
  <use href="#hi-document-chart-bar" class="hero heroBlue" x="293" y="606" width="34" height="34"/>
  <text class="title" x="353" y="631">报告生成模块</text>
</svg>
