    <style>
      .page { fill: #fff; }
      .divider { stroke: #c2c9d1; stroke-width: 1; }
      .wire { fill: none; stroke: #334960; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .wireArrow { fill: none; stroke: #334960; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrowHead); }
      .wireSoft { fill: none; stroke: #334960; stroke-width: 2.6; stroke-linecap: square; stroke-linejoin: miter; marker-end: url(#arrowHead); }
      .topBox { fill: url(#blueFill); stroke: #416b9b; stroke-width: 1.45; }
      .bandBox { fill: url(#blueFill); stroke: #6a9bce; stroke-width: 1.35; }
      .smallBox { fill: url(#blueFill); stroke: #7fa9d4; stroke-width: 1.25; }
      .greenBox { fill: url(#greenFill); stroke: #6a984c; stroke-width: 1.35; }
      .purpleBox { fill: url(#purpleFill); stroke: #9b82ca; stroke-width: 1.35; }
      .goldBox { fill: url(#goldFill); stroke: #dba028; stroke-width: 1.35; }
      .cyanBox { fill: url(#cyanFill); stroke: #69a7bf; stroke-width: 1.35; }
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; fill: #202326; }
      .title { font-size: 16px; font-weight: 700; }
      .label { font-size: 14px; font-weight: 700; }
      .body { font-size: 13px; font-weight: 600; }
      .smallText { font-size: 13px; font-weight: 700; }
      .strokeBlue { fill: none; stroke: #3a5169; stroke-width: 2.45; stroke-linecap: round; stroke-linejoin: round; }
      .strokeGreen { fill: none; stroke: #72995a; stroke-width: 2.7; stroke-linecap: square; stroke-linejoin: round; }
      .strokePurple { fill: none; stroke: #8068ae; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
      .strokeCyan { fill: none; stroke: #34768f; stroke-width: 2.65; stroke-linecap: round; stroke-linejoin: round; }
      .goldIcon { fill: #c99b1a; stroke: #c99b1a; stroke-width: 1.2; }
      .hero { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      .heroBlue { color: #3a5169; }
      .heroGreen { color: #6f9956; }
      .heroPurple { color: #8068ae; }
      .heroGold { color: #c99b1a; }
      .heroCyan { color: #34768f; }
    </style>
